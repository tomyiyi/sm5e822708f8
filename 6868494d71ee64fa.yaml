rules:
  # 局域网直连
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,private,DIRECT,no-resolve

  - DOMAIN-SUFFIX,instagram.com,📷IG·Pinterest 自动
  - DOMAIN-SUFFIX,cdninstagram.com,📷IG·Pinterest 自动
  - DOMAIN-SUFFIX,ig.me,📷IG·Pinterest 自动
  - DOMAIN-SUFFIX,instagr.am,📷IG·Pinterest 自动
  - DOMAIN-SUFFIX,facebook.com,📷IG·Pinterest 自动
  - DOMAIN-SUFFIX,fbcdn.net,📷IG·Pinterest 自动
  - DOMAIN-SUFFIX,facebook.net,📷IG·Pinterest 自动
  - DOMAIN-SUFFIX,accountkit.com,📷IG·Pinterest 自动
  - DOMAIN-SUFFIX,threads.net,📷IG·Pinterest 自动
  - DOMAIN-SUFFIX,threads.com,📷IG·Pinterest 自动
  - DOMAIN-SUFFIX,pinterest.com,📷IG·Pinterest 自动
  - DOMAIN-SUFFIX,pinimg.com,📷IG·Pinterest 自动
  - DOMAIN-SUFFIX,pinterest.co.uk,📷IG·Pinterest 自动
  - DOMAIN-SUFFIX,pinterest.de,📷IG·Pinterest 自动

  # 国内主流域名后缀直连
  - DOMAIN-SUFFIX,cn,DIRECT

  # 国内常见生态服务直连（微信、淘宝、支付宝、抖音、百度等）
  - DOMAIN-KEYWORD,baidu,DIRECT
  - DOMAIN-KEYWORD,bilibili,DIRECT
  - DOMAIN-KEYWORD,alipay,DIRECT
  - DOMAIN-KEYWORD,taobao,DIRECT
  - DOMAIN-KEYWORD,qq,DIRECT
  - DOMAIN-KEYWORD,tencent,DIRECT
  - DOMAIN-KEYWORD,wechat,DIRECT
  - DOMAIN-KEYWORD,jd,DIRECT
  - DOMAIN-KEYWORD,bytedance,DIRECT
  - DOMAIN-KEYWORD,douyin,DIRECT
  - DOMAIN-KEYWORD,zhihu,DIRECT
  - DOMAIN-KEYWORD,163,DIRECT
  - DOMAIN-KEYWORD,sina,DIRECT
  - DOMAIN-KEYWORD,weibo,DIRECT
  - DOMAIN-KEYWORD,csdn,DIRECT
  - DOMAIN-KEYWORD,alicdn,DIRECT
  - DOMAIN-KEYWORD,bdstatic,DIRECT

  # 中国大陆域名与地理 IP 直连
  - GEOSITE,category-games@cn,DIRECT
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT

  # 兜底：所有境外流量走代理
  - MATCH,PROXY
